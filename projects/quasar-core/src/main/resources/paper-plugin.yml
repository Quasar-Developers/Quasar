name:        Quasar
version:     ${version}
website:     https://quasarmc.net
description: The Quasar server plugin
author:      Quasar Contributors (see GitHub)

main:         net.quasarmc.quasar.core.QuasarPlugin
bootstrapper: net.quasarmc.quasar.core.QuasarPluginBootstrap
api-version:  '26.2'
load:         STARTUP
prefix:       Quasar

permissions:
  quasar.core.admin:
    description: Administration
    children:
      erase_entity:
        description: Allow use of the Entity Eraser
        default:     false
      fakeop:
        description: Spoof the client being a certain permission level.
        default:     false
        children:
          0: { description: "Permission Level 0", default: false }
          1: { description: "Permission Level 1", default: false }
          2: { description: "Permission Level 2", default: false }
          3: { description: "Permission Level 3", default: false }
          4: { description: "Permission Level 4", default: false }

